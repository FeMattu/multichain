# ---------------------------------------------------------------------------
# Alternative to ./docker/mcsim, for people who prefer compose.
#
#   cp docker/.env.example docker/.env      # then edit if you like
#   docker compose -f docker/docker-compose.yml build
#   docker compose -f docker/docker-compose.yml run --rm emu mc-build
#   docker compose -f docker/docker-compose.yml run --rm emu \
#       experiments/scripts/run_experiment.sh \
#           --experiment experiments/configs/experiments/smoke-3n.yaml
#
# The flags below are the same ones mcsim passes, and for the same reasons -
# docker/README.md explains each. NET_ADMIN, SYS_ADMIN and the unconfined
# AppArmor profile are the three without which nothing works.
#
# Resources are UNCONSTRAINED by default: with CPUS, CPUSET and MEMORY unset
# the container gets every CPU and all the memory the host has, which is what
# an emulation run wants - a throttled run measures the throttle. Set them in
# .env only when you deliberately want less.
# ---------------------------------------------------------------------------
services:
  emu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UBUNTU_VERSION: "22.04"
        PROJECT_DIR: ${PROJECT_DIR:-/workspace/multichain}
    image: ${IMAGE:-poesia-emu:22.04}

    # NET_ADMIN creates veth pairs, addresses, routes and qdiscs. SYS_ADMIN is
    # for `ip netns add`, which mounts /run/netns and unshares a namespace -
    # neither is a network operation, and NET_ADMIN alone fails at
    # "mount --make-shared /run/netns failed". Deliberately NOT privileged.
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN

    # Docker's default AppArmor profile denies mount() whatever the
    # capabilities say, so SYS_ADMIN without this still cannot make a namespace.
    security_opt:
      - apparmor=unconfined

    # Its own network namespace, so the emulated nodes cannot reach the host's
    # real network. `network_mode: none` would remove lo, which the management
    # bridge needs.
    networks:
      - emulation

    # /var/run/netns must be writable for `ip netns`.
    tmpfs:
      - /run:rw,exec,nosuid,size=64m

    # Twenty daemons with their peers exhaust the default soft limit.
    ulimits:
      nofile:
        soft: ${NOFILE:-1048576}
        hard: ${NOFILE:-1048576}

    volumes:
      # The repository, by a path relative to this file: no host path is
      # baked into anything versioned.
      - ..:${PROJECT_DIR:-/workspace/multichain}
      # Run output, kept off the repository volume.
      - ${RESULTS_DIR:-../experiments/results}:/results

    working_dir: ${PROJECT_DIR:-/workspace/multichain}

    environment:
      MULTICHAIN_HOME: ${PROJECT_DIR:-/workspace/multichain}
      EXPERIMENT_ROOT: /results
      MC_PREFLIGHT: ${MC_PREFLIGHT:-auto}

    # All three empty by default = no limit. CPUSET takes a physical-core-only
    # list from `./docker/mcsim cpus`; CPUS a fractional quota; MEMORY a
    # ceiling such as 16g.
    cpuset: ${CPUSET:-}
    cpus: ${CPUS:-0}
    mem_limit: ${MEMORY:-0}

    stdin_open: true
    tty: true

networks:
  emulation:
    driver: bridge
