# The smallest map that still exercises everything the fabric does: one hub, two
# leaves, two access links, and therefore one two-hop path (pisa <-> bologna via
# firenze) which is what proves the static routing works at all.
#
# Coordinates are the real Florence / Pisa / Bologna ones, so the derived delays
# are the same the regional map gives those three sites and a smoke run is a
# scaled-down regional run rather than a different network.
#
# Four chain nodes sit on three sites: admin and the CA share bologna, which is
# what proves co-location works. See ../schema.md.
name: smoke-4n
latency_model:
  propagation_ms_per_km: 0.005
  routing_factor: 1.4
  overhead_backbone_ms: 0.5
  overhead_access_ms: 1.0
  loopback_ms: 0.2
  loss_access: 0.0004
  loss_backbone_base: 0.0002
  loss_backbone_per_km: 2.0e-07
defaults:
  bandwidth_hub_mbps: 1000.0
  bandwidth_leaf_mbps: 200.0
nodes:
- id: firenze
  label: HUB_TOSCANA_Firenze
  kind: hub
  scope: regional
  region: tuscany
  country: italy
  continent: europe
  lat: 43.7696
  lon: 11.2558
- id: pisa
  label: Pisa
  kind: leaf
  scope: regional
  region: tuscany
  country: italy
  continent: europe
  lat: 43.7228
  lon: 10.4017
- id: bologna
  label: Bologna
  kind: leaf
  scope: regional
  region: emilia-romagna
  country: italy
  continent: europe
  lat: 44.4949
  lon: 11.3426
links:
- source: pisa
  target: firenze
  kind: access
- source: bologna
  target: firenze
  kind: access
