# Malicious-miner experiment: 1 admin, 2 CAs, 10 miners, 15 companies.
# 28 nodes, 5 epochs of 30 blocks ~ 150 blocks at 5 s/block, roughly 12.5 minutes.
# Identical to the honest profiles in every respect
# EXCEPT the `malicious` section at the bottom — a profile without that section behaves
# exactly as it did before the feature existed, so this is the one file to read to see
# what the experiment adds.
#
# Format and defaults: ../schema.md (the `malicious` section is documented there too).
# The wPoA/WeightEngine activation flags are NOT configurable here: every chain this
# harness creates runs the full stack (weights -> selection -> vrf -> randao ->
# sortition -> malus) plus the weight engine.

seed: 20260905
chain_name: wpoa-smoke-malicious

nodes:
  ca_count: 2
  miner_count: 10
  company_count: 15

network:
  host: 127.0.0.1
  base_port: 7547
  base_rpc_port: 8547

epochs:
  count: 5
  length_blocks: 30

chain:
  target-block-time: 5
  # 0, not the stock 0.3: at 0.3 with 10 miners the round-robin spacing is binding even
  # under wPoA and the observed distribution collapses onto round robin, which would
  # mask the very thing this harness measures.
  mining-diversity: 0.0
  mine-empty-rounds: -1
  mining-requires-peers: false
  first-block-reward: 100000000000000
  initial-block-reward: 0
  minimum-relay-fee: 20000000
  anyone-can-connect: false

wpoa:
  dump-function: none
  wpoa-sortition-delta: 0.5
  wpoa-sortition-lambda: 0.2
  wpoa-malus-mu: 0.5
  wpoa-malus-max: 4.0
  wpoa-malus-equiv-points: 4.0
  wpoa-malus-delay-points: 0.25
  wpoa-malus-selfwrite-points: 1.0
  wpoa-malus-badweight-points: 2.0

weight_engine:
  weight-kappa: 100.0
  weight-alpha: 0.2
  weight-lambda: 0.5

traffic:
  event_stream: supply-chain-events
  company_tx_per_epoch_range: [30, 60]
  miner_gas_returns_per_epoch_range: [0, 5]
  esg_score_range: [1, 100]
  restitution_amount_range: [1.0, 9.0]

# The malicious-miner experiment. Only miners can be selected; the selection is a
# deterministic function of `seed`, so this profile always chooses the same two miners
# and records them (with the seed) in the run manifest.
malicious:
  enabled: true
  miner_count: 2                 # 0 <= miner_count <= nodes.miner_count
  target_action_rate: 0.15       # share of the malicious opportunities to act on, in [0,1]
  seed: 12345                    # selection + Bernoulli decisions (defaults to the run seed)
  # Only `selfwrite` and `badweight` are implementable from the harness. `delay` and
  # `equiv` would require the consensus core and are rejected by the loader.
  actions:
    selfwrite: 0.5
    badweight: 0.5
  # Start after the bootstrap/setup phase, so the injected offences land on epochs the
  # analysis actually measures rather than on the native-round-robin setup blocks.
  start_epoch: 4
  stop_epoch: null               # null = to the end of the run
  # Which self-attested stream a selfwrite targets. `weight-engine-membership` is
  # preferred: a forged record there cannot perturb the weight registry even momentarily.
  selfwrite_stream: weight-engine-membership

runtime:
  bindir: src
  rpc_timeout_s: 30
  startup_timeout_s: 120
  wpoa_debug: false
