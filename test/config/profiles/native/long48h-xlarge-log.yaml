# Statistical long-run, xlarge/stress size: 1 admin, 4 CAs, 15 miners, 30 companies ->
# 50 nodes. NEW scale tier, extending the small/medium/large progression (10/18/34
# nodes) to see how the weight-selection feedback loop and the dump-function behave
# under a heavier validator set. 222 epochs of 60 blocks -> 13320 configured blocks at
# 13 s/block = 48h06m of pure mining time.
# Overhead at this node count is NOT reliably known by extrapolating small/medium/large
# (their overhead grew from ~5% to ~12.5% as node count grew from 10 to 34) -- treat
# 48h06m as a LOWER BOUND and confirm the real setup-first-blocks formula against
# ../schema.md 3 before scheduling this unattended.
# startup_timeout_s raised to 180 (vs. 120 everywhere else): 50 daemons contending for
# one host is beyond the largest previously-tested profile (34).
#
# Format and defaults: ../schema.md
# The wPoA/WeightEngine activation flags are NOT configurable here: every chain this
# harness creates runs the full stack (weights -> selection -> vrf -> randao ->
# sortition -> malus) plus the weight engine.
#
# Part of a none/log/sqrt triplet (same seed, same node mix, same everything else).
# Disjoint port ranges: run the three in parallel.

seed: 20260905
chain_name: wpoa-long48h-xlarge-log

nodes:
  ca_count: 4
  miner_count: 15
  company_count: 30

network:
  host: 127.0.0.1
  base_port: 10600
  base_rpc_port: 20600

epochs:
  count: 222
  length_blocks: 60

chain:
  target-block-time: 13
  mining-diversity: 0.0
  mine-empty-rounds: -1
  mining-requires-peers: false
  first-block-reward: 100000000000000
  initial-block-reward: 0
  minimum-relay-fee: 20000000
  anyone-can-connect: false

wpoa:
  dump-function: log
  wpoa-sortition-delta: 0.5
  wpoa-sortition-lambda: 0.3
  wpoa-malus-mu: 0.5
  wpoa-malus-max: 4.0
  wpoa-malus-equiv-points: 4.0
  wpoa-malus-delay-points: 0.25
  wpoa-malus-selfwrite-points: 1.0
  wpoa-malus-badweight-points: 2.0

weight_engine:
  weight-kappa: 100.0
  weight-alpha: 0.2
  weight-lambda: 0.5

traffic:
  event_stream: supply-chain-events
  company_tx_per_epoch_range: [30, 60]
  miner_gas_returns_per_epoch_range: [0, 5]
  esg_score_range: [1, 100]
  restitution_amount_range: [1.0, 9.0]

runtime:
  # The node's JSON writer decides how many decimals a double needs by rounding
  # it and then emits it by truncating it, so a value whose fraction rounds up
  # to 1.000...0 at the default of 14 is reported as its floor. 17 is a double's
  # round-trip precision, which puts that boundary out of reach. See
  # ../../schema.md and analysis/pipeline/tools/verify_json_double_rendering.py.
  api_decimal_digits: 17
  bindir: src
  rpc_timeout_s: 30
  startup_timeout_s: 180
  wpoa_debug: false
