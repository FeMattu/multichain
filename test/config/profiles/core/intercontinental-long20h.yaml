# Level 4 - intercontinental: twenty real MultiChain nodes on seven hubs on five continents, worst hop across the Pacific.
#
# Time: 60*120 = 7200 blocks + 126 of setup = 7326 blocks, 10 s each ~20h21m hours wall clock. 
# This is the longest-running test profile, and the one that most closely resembles a real-world deployment. 
# It is also the one that is most likely to reveal bugs in the harness or the protocol, 
# because it runs for a long time and has the worst network conditions of any of the four level profiles.
#
# The geography is the ONLY independent variable across the four level profiles.
# Node list, roles, clusters, chain parameters, traffic and seed are identical on
# purpose, so a difference in the results is a difference in the network:
#
#   diff test/config/profiles/core/regional.yaml \
#        test/config/profiles/core/intercontinental.yaml
#
# differs by chain_name, topology and the `location` of each node, and by nothing
# else. Worst one-way path on this map: 181.5 ms.
#
# Format and defaults: ../../schema.md. The wPoA/WeightEngine activation flags are
# NOT configurable: every chain this harness creates runs the full stack.

seed: 20260905
chain_name: wpoa-core-intercontinental

# One namespace per site of this map, cables carrying netem between them.
fabric:
  backend: core

topology: topologies/intercontinental.yaml

# No network_profile: every link's impairment is derived from the map's own
# latency_model and the endpoints' coordinates. Naming one here would override
# that flat, which is what the degraded and partitioned profiles are for.

network:
  base_port: 7867
  base_rpc_port: 8867

# Every node names a site of the topology. A company also names the miner whose
# cluster it belongs to: on this map the assignment is a decision, not a draw.
nodes:
  - {id: admin,     role: admin,   location: paris-i}
  - {id: ca-0,      role: ca,      location: london-i}
  - {id: ca-1,      role: ca,      location: dubai}
  - {id: miner-0,   role: miner,   location: milano-i}
  - {id: miner-1,   role: miner,   location: frankfurt-i}
  - {id: miner-2,   role: miner,   location: new-york}
  - {id: miner-3,   role: miner,   location: singapore}
  - {id: miner-4,   role: miner,   location: sao-paulo}
  - {id: miner-5,   role: miner,   location: tokyo}
  - {id: miner-6,   role: miner,   location: johannesburg}
  - {id: miner-7,   role: miner,   location: los-angeles}
  - {id: miner-8,   role: miner,   location: seoul}
  - {id: miner-9,   role: miner,   location: buenos-aires}
  - {id: company-0, role: company, location: zurich-i, cluster: miner-0}
  - {id: company-1, role: company, location: marseille-i, cluster: miner-1}
  - {id: company-2, role: company, location: amsterdam-i, cluster: miner-2}
  - {id: company-3, role: company, location: warszawa-i, cluster: miner-3}
  - {id: company-4, role: company, location: toronto, cluster: miner-4}
  - {id: company-5, role: company, location: sydney, cluster: miner-5}
  - {id: company-6, role: company, location: mumbai, cluster: miner-6}
  - {id: company-7, role: company, location: los-angeles, cluster: miner-7}
  - {id: company-8, role: company, location: seoul, cluster: miner-8}
  - {id: company-9, role: company, location: buenos-aires, cluster: miner-9}
  - {id: company-10, role: company, location: dubai, cluster: miner-3}
  - {id: company-11, role: company, location: paris-i, cluster: miner-4}
  - {id: company-12, role: company, location: tokyo, cluster: miner-5}
  - {id: company-13, role: company, location: johannesburg, cluster: miner-6}
  - {id: company-14, role: company, location: milano-i, cluster: miner-7}
  - {id: company-15, role: company, location: frankfurt-i, cluster: miner-8}
  - {id: company-16, role: company, location: new-york, cluster: miner-9}
  - {id: company-17, role: company, location: singapore, cluster: miner-0}
  - {id: company-18, role: company, location: sao-paulo, cluster: miner-1}
  - {id: company-19, role: company, location: zurich-i, cluster: miner-2}

epochs:
  count: 60
  length_blocks: 120

chain:
  # 10 s, comfortably above the worst round trip of every one of the four maps:
  # a target below it would measure the emulator's queueing, not the protocol.
  target-block-time: 10
  mining-diversity: 0.0
  mine-empty-rounds: -1
  mining-requires-peers: false
  first-block-reward: 100000000000000
  initial-block-reward: 0
  minimum-relay-fee: 20000000
  anyone-can-connect: false

wpoa:
  dump-function: sqrt
  wpoa-sortition-delta: 0.5
  wpoa-sortition-lambda: 0.3
  wpoa-malus-mu: 0.5
  wpoa-malus-max: 4.0
  wpoa-malus-equiv-points: 4.0
  wpoa-malus-delay-points: 0.25
  wpoa-malus-selfwrite-points: 1.0
  wpoa-malus-badweight-points: 2.0

weight_engine:
  weight-kappa: 100.0
  weight-alpha: 0.2
  weight-lambda: 0.5

traffic:
  event_stream: supply-chain-events
  company_tx_per_epoch_range: [40, 80]
  miner_gas_returns_per_epoch_range: [0, 7]
  esg_score_range: [1, 100]
  restitution_amount_range: [1.0, 100.0]

runtime:
  # The node's JSON writer decides how many decimals a double needs by rounding
  # it and then emits it by truncating it, so a value whose fraction rounds up
  # to 1.000...0 at the default of 14 is reported as its floor. 17 is a double's
  # round-trip precision, which puts that boundary out of reach. See
  # ../../schema.md and analysis/pipeline/tools/verify_json_double_rendering.py.
  api_decimal_digits: 17
  bindir: src
  rpc_timeout_s: 30
  startup_timeout_s: 120
  wpoa_debug: true
