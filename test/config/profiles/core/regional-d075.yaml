# Regional, delta 0.75 - regional-long23h-feedback with the delay band set to Delta_max = 6 s.
#
# One point of a sweep on the band half-width: delta = 0.25 / 0.5 / 0.75, i.e.
# Delta_max = 2 / 4 / 6 s at T_block = 8 s. The delta = 0.5 point is
# regional-long23h-feedback itself. Same seed, map, nodes, traffic and weight parameters:
# only wpoa-sortition-delta changes, and the run is shorter (30 epochs).
#
# What it measures: Prop. 5.18 predicts inversions linear in 1 / Delta_max at first order,
# P ~ m sigma / (2 sqrt(2) Delta_max). With the same sigma, the instantaneous inversion rate
# (first block received is not the argmin's) should scale as 4 : 2 : 1.33 over the sweep,
# and the fork rate with it. The final rate, after the score tie-break, should stay small.
# Delta_max = 6 s gives a band of [2, 14] s around T_block and a feedback bound
# M = min(0.5 * 8, 8 * (1 - 0.75) / 0.3) = 4.00 s.
#
# Watch: the fastest slot opens 2 s after the parent, close to the time a node needs to
# process a block (~1.6 s on the regional runs, 99th percentile ~2.5 s). A node that
# processes the parent after its own slot starts late, and that reintroduces the incumbent
# advantage in some rounds. The incumbent's share of the inversions tells whether it does.
#
# ETA: 30 epochs x 100 blocks x 8 s = 6h40m, plus bootstrap ~28m: ~7h10m.

seed: 20260905
chain_name: wpoa-core-regional-d075

fabric:
  backend: core

topology: topologies/regional.yaml

network:
  base_port: 7747
  base_rpc_port: 8747

# Every node names a site of the topology. A company also names the miner whose
# cluster it belongs to: on this map the assignment is a decision, not a draw.
