# Regional, whale, damping none - one validator with most of the weight, damped by g(w) = w.
#
# One of three profiles (regional-whale-none, -sqrt, -log) that differ ONLY in
# dump-function. Base: regional-long23h (seed, map, miners, traffic, weight-lambda 0.5).
#
# What is changed against the base: the cluster composition. miner-2, whose certified ESG
# is the highest of the five under this seed (75), heads 18 of the 30 companies; the other
# four head 3 each. The company count, and so the traffic and the host load, stay the same.
# ESG scores are drawn per node from the seed, so they do not move with the clusters.
#
# Why: on the 23h runs the weights stay within a factor ~3, where damping is almost
# invisible, and on long24h-large the log damping flattened ESG-sized weights to a factor
# 1.18. This is the scenario of the thesis' reference table (one whale against four equal
# validators). Expected shares, from W_k = ESG * (tau + sum c_i) with this seed's ESG and
# mean activity, at the published scale (w ~ 1e4-1e6):
#   none  whale 0.73, others 0.03-0.12   (reference table: 0.714)
#   sqrt  whale 0.46, others 0.10-0.19   (reference table: 0.442)
#   log   whale 0.23, others 0.18-0.20   (reference table: 0.325; flatter here because
#         ln(1 + w) compresses harder at weights of 1e4-1e6 than at the table's 10-100)
# The test is the per-epoch goodness of fit against the damped share g(w)/sum g(w), and
# that the ordering is kept: under log the whale must still win most often.
#
# weight-lambda stays at 0.5, as in the base: rho is ~0.003, so the feedback factor is a
# near-constant 0.50 and the whale stays a whale in every epoch.
#
# ETA: 50 epochs x 100 blocks x 8 s = 11h07m, plus bootstrap ~28m: ~11h35m.

seed: 20260905
chain_name: wpoa-core-regional-whale-none

fabric:
  backend: core

topology: topologies/regional.yaml

network:
  base_port: 7747
  base_rpc_port: 8747

# Every node names a site of the topology. A company also names the miner whose
# cluster it belongs to: on this map the assignment is a decision, not a draw.
