# Regional, 25 x 400 - regional-long23h-feedback with the same blocks cut into fewer,
# longer epochs.
#
# Same seed, map, nodes, block time and total length (10 000 blocks) as the 23h runs, and
# the same weight parameters as regional-long23h-feedback. What changes is the epoch
# geometry: 25 epochs of 400 blocks instead of 100 of 100. Every per-epoch traffic range
# is scaled by 4, so the traffic PER BLOCK is the same as in the 23h runs, and the derived
# budgets come out identical: miner_seed_gas = 80 * 25 * 250 * 1.2 + 200 = 600 200 and
# gas_seed = 240 * 0.2 * 25 * 1.5 + 50 = 1 850, exactly as there.
#
# The hypothesis under test: the funding is the same, R_k per epoch is 4x larger, so
# rho_k = R_k / saldo_k should be ~4x larger (ceiling ~1/(1.2*25) = 0.033 instead of
# 0.008). If it is, the restitution feedback is bounded by the epoch count and not by the
# engine. It also measures the cost of the lever: the weight -- and with it the feedback
# and a malus -- updates 4x less often, and wpoa-randao-lookback grows to 401.
#
# ETA: target height (25 + 1) * 400 + 20 = 10 420 blocks x 8 s = 23h09m, plus daemon
# start-up: under 24h. (One extra epoch of 400 blocks is what the verification needs.)

seed: 20260905
chain_name: wpoa-core-regional-e400

fabric:
  backend: core

topology: topologies/regional.yaml

network:
  base_port: 7747
  base_rpc_port: 8747

# Every node names a site of the topology. A company also names the miner whose
# cluster it belongs to: on this map the assignment is a decision, not a draw.
nodes:
