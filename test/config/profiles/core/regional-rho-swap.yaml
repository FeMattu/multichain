# Regional, rho crossover - regional-long23h-feedback with two miners told how much to return.
#
# The controlled experiment on the restitution rate rho. In every other run all miners draw
# their restitutions from one shared range, so rho differs between miners only by chance and
# its effect on the weight shows up as noise (d075: lag-1 Spearman rho -> weight 0.60). Here
# two miners with the same ESG class and cluster size are given opposite behaviours and swap
# them halfway, a crossover design:
#
#   miner-1 (ESG 56, 6 companies): generous in epochs 1-14, stingy from epoch 15
#   miner-3 (ESG 55, 6 companies): stingy   in epochs 1-14, generous from epoch 15
#   miner-0, miner-2, miner-4:      the shared range, unchanged (controls)
#
#   generous: 16-20 returns per epoch of 200-250 -> E[R_k] ~ 4 050, rho ~ 0.022
#   stingy:    0-2  returns per epoch of  50-100 -> E[R_k] ~    75, rho ~ 0.0004
#   shared:    0-20 returns per epoch of  50-250 -> E[R_k] ~ 1 500, rho ~ 0.008
#
# rho = R_k / saldo_k, and saldo_k is almost exactly the miner's funding seed (restitutions
# never leave saldo; fees add ~20 per epoch). The seed is sized on the largest range any miner
# can draw from and is the SAME for every miner: 20 x 30 x 250 x 1.2 + 200 = 180 200, exactly
# as in regional-d025 and regional-d075. With lambda_w = 0.99 the weight factor is
# 0.01 + 0.99 rho: ~0.032 generous, ~0.010 stingy, ~0.018 shared, so the generous twin is
# entitled to ~3x the weight of the stingy one, and the swap reverses it.
#
# Same seed, map, nodes, clusters, block time, traffic, delta (0.5) and weight parameters as
# regional-long23h-feedback, and the same 30 x 100 geometry and funding as the delta sweep.
# The chain parameters are those of regional-long23h-feedback: only the harness's
# restitution behaviour of two miners differs, which is not a chain parameter.
#
# Causal lag (engine alignment): the restitutions of block-epoch e set rho of engine epoch
# e + 1, whose factor is in the weight published as engine epoch e + 2 and in force from
# early in block-epoch e + 2. The swap declared at epoch 15 therefore reaches the election at
# epoch 17. Phase 3 traces the lag from the data (rho_contrast.md) and draws
# plots/rho_effect_weight.png and plots/rho_effect_election.png.
#
# ETA: 30 epochs x 100 blocks x 8 s = 6h40m, plus bootstrap ~28m: ~7h10m.

seed: 20260905
chain_name: wpoa-core-regional-rho-swap

fabric:
  backend: core

topology: topologies/regional.yaml

network:
  base_port: 7747
  base_rpc_port: 8747

# Every node names a site of the topology. A company also names the miner whose
# cluster it belongs to: on this map the assignment is a decision, not a draw.
