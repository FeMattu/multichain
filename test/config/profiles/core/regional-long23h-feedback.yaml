# Regional, weight feedback - regional-long23h with the restitution feedback made visible.
#
# Same seed, map, nodes, epochs and traffic as regional-long23h: the ONLY differences are
# weight-lambda (0.5 -> 0.99) and wpoa-malus-max (4.0 -> 3.0, inert without a malus).
# Every draw of the traffic generators is therefore the same as in the 23h run, and so
# are R_k and the saldo: what changes is how much rho moves w_k.
#
# Why rho is small and stays small: saldo_k counts the miner's up-front funding
# (miner_seed_gas = 20 * 100 * 250 * 1.2 + 200 = 600 200 GAS), and a restitution does not
# lower it (Def. guadagno adds R_k back). So rho_k = R_k / saldo_k <= ~1/(1.2*epochs)
# = 0.008; measured on the 23h run: mean 0.0025, max 0.006. That ceiling is a property of
# the funding, not of this profile -- see regional-long23h-e25x400 for the epoch lever.
#
# Pair: regional-long23h-malus.yaml is this profile plus the `malicious` section.
#
# ETA: 100 epochs x 100 blocks x 8 s = 22h13m, plus bootstrap ~28m: ~23h.

seed: 20260905
chain_name: wpoa-core-regional-fb

fabric:
  backend: core

topology: topologies/regional.yaml

network:
  base_port: 7747
  base_rpc_port: 8747

# Every node names a site of the topology. A company also names the miner whose
# cluster it belongs to: on this map the assignment is a decision, not a draw.
