# Regional, weight feedback at 5 s - regional-long23h-feedback with a 5 s target block time.
#
# Same seed, map, nodes, epochs (100 x 100), traffic per epoch and weight parameters as
# regional-long23h-feedback. The ONLY difference is target-block-time (8 -> 5 s). Every
# draw of the traffic generators is therefore the same; what changes is the clock: the
# same blocks and the same transactions arrive 1.6x faster.
#
# Its comparison partner is regional-long23h-feedback, not regional-long23h: against the
# latter both the block time and weight-lambda would change, and no difference could be
# attributed to either. Both partners must run on the same binary.
#
# What it measures:
# - whether the weight feedback behaves the same at a faster clock. It should: rho, the
#   saldo and w_k depend on the epoch, not on the seconds in it;
# - whether the timer race holds up at 5 s. The band is 2.5-7.5 s (delta = 0.5), and the
#   fastest slot now sits close to the time a node needs to process a block (about 1.6 s
#   on the regional runs, growing with height). A node that finishes processing the parent
#   after its own slot starts at once, so inversions and the incumbent's share are the
#   numbers to watch;
# - the Phi feedback with a smaller bound: M = min(0.5 * 5, 5 * 0.5 / 0.3) = 2.5 s.
#
# Why weight-lambda is the lever for "more feedback" and nothing else is: saldo_k counts
# the miner's up-front funding, miner_seed_gas = returns_max * epochs * restitution_max *
# 1.2 + 200, which scales with the restitution traffic, so rho_k <= ~1/(1.2 * epochs)
# whatever the ranges. Only weight-lambda (here 0.99) or the epoch count
# (regional-long23h-e25x400) moves it.
#
# ETA: 100 epochs x 100 blocks x 5 s = 13h53m, plus bootstrap ~18m: ~14h15m.

seed: 20260905
chain_name: wpoa-core-regional-fb-t5

fabric:
  backend: core

topology: topologies/regional.yaml

network:
  base_port: 7747
  base_rpc_port: 8747

# Every node names a site of the topology. A company also names the miner whose
# cluster it belongs to: on this map the assignment is a decision, not a draw.
