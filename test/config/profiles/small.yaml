# Smallest useful functional run: 1 admin, 1 CA, 3 miners, 5 companies.
# 10 nodes, 20 epochs of 20 blocks -> ~420 blocks at 2 s/block, roughly 15 minutes.
#
# Format and defaults: ../schema.md
# The wPoA/WeightEngine activation flags are NOT configurable here: every chain this
# harness creates runs the full stack (weights -> selection -> vrf -> randao ->
# sortition -> malus) plus the weight engine.

seed: 20260905
chain_name: wpoa-smoke-small

nodes:
  ca_count: 1
  miner_count: 3
  company_count: 5

network:
  host: 127.0.0.1
  base_port: 7447
  base_rpc_port: 8447

epochs:
  count: 20
  length_blocks: 20

chain:
  target-block-time: 2
  # 0, not the stock 0.3: at 0.3 with 3 miners the round-robin spacing is binding even
  # under wPoA and the observed distribution collapses onto round robin, which would
  # mask the very thing this harness measures.
  mining-diversity: 0.0
  mine-empty-rounds: -1
  mining-requires-peers: false
  # Premined currency (thesis 4.2.1): the whole supply at genesis, no per-block subsidy.
  first-block-reward: 100000000000000
  initial-block-reward: 0
  # 0.2 GAS per 1000 bytes. -maxtxfee is derived from this; see ../schema.md 3.
  minimum-relay-fee: 20000000
  anyone-can-connect: false

wpoa:
  dump-function: none
  wpoa-sortition-delta: 0.5
  wpoa-sortition-lambda: 0.0
  wpoa-malus-mu: 0.5
  wpoa-malus-max: 4.0
  wpoa-malus-equiv-points: 4.0
  wpoa-malus-delay-points: 0.25
  wpoa-malus-selfwrite-points: 1.0
  wpoa-malus-badweight-points: 2.0

weight_engine:
  weight-kappa: 100.0
  weight-alpha: 0.2
  weight-lambda: 0.5

traffic:
  event_stream: supply-chain-events
  company_tx_per_epoch_range: [30, 60]
  miner_gas_returns_per_epoch_range: [0, 5]
  esg_score_range: [1, 100]
  restitution_amount_range: [1.0, 9.0]

runtime:
  bindir: src
  rpc_timeout_s: 30
  startup_timeout_s: 120
  wpoa_debug: false
