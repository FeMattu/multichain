# Level 1 - regional. Twenty real MultiChain nodes on a Tuscany/Liguria/Emilia-Romagna map.
#
# The geography is the ONLY independent variable across the four level
# descriptors: node list, roles, clusters, chain parameters, seed and schedule
# are identical on purpose, so a difference in the results is a difference in
# the network.
#
#   diff configs/experiments/regional.yaml configs/experiments/national.yaml
#
# differs by name, scenario, topology and the 'location' of each node - and by
# nothing else.
name: regional
description: Level 1 - regional. Twenty real MultiChain nodes on a Tuscany/Liguria/Emilia-Romagna map.
scenario: regional
seed: 20260910
topology: experiments/configs/topologies/regional.yaml
chain_params: experiments/configs/chain-params/tbt10s-sqrt.dat
mode: native
fabric:
  backend: auto
  subnet: 11.0.0.0/24
  link_subnet: 10.99.0.0/16
  host_uplink: true
multichain:
  rpc_port: 27000
  p2p_port: 27001
  debug: wpoa
schedule:
  duration_s: auto
  measure_epochs: 16
expected:
  min_blocks: 1
  min_peers: 2
  require_all_nodes_synced: true
