# Level 4 - intercontinental. The same twenty nodes, five continents.
#
# The geography is the ONLY independent variable across the four level
# descriptors: node list, roles, clusters, chain parameters, seed and schedule
# are identical on purpose, so a difference in the results is a difference in
# the network.
#
#   diff configs/experiments/regional.yaml configs/experiments/national.yaml
#
# differs by name, scenario, topology and the 'location' of each node - and by
# nothing else.
