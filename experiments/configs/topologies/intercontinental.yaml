name: intercontinental
description: 'Level 4 - intercontinental: seven hubs on five continents, worst hop across the Pacific.'
source: 'extends shadow/config/levels/intercontinentale.json @ 6278274 with the five-continent backbone of shadow/config/topologies/intercontinental-global.json:
  the ten historical locations keep their coordinates, labels and GML ids; Singapore, Sao Paulo, Tokyo and Johannesburg
  become hubs and six further sites were added to reach twenty nodes.'
