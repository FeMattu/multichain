name: regional
description: 'Level 1 - regional: Tuscany / Liguria / Emilia-Romagna, seven backbone hubs.'
source: 'extends shadow/config/levels/regionale.json @ 6278274: the ten historical locations keep their coordinates,
  labels and GML ids; ten more sites of the same three regions were added to reach twenty nodes and seven miner
  hubs. Delays are derived by the shared physical model, so this topology stays comparable with legacy-regional-10n.'
latency_model:
  propagation_ms_per_km: 0.005
  routing_factor: 1.4
  overhead_backbone_ms: 0.5
  overhead_access_ms: 1.0
  loopback_ms: 0.2
  loss_access: 0.0004
  loss_backbone_base: 0.0002
  loss_backbone_per_km: 2.0e-07
defaults:
  bandwidth_hub_mbps: 1000.0
  bandwidth_leaf_mbps: 200.0
